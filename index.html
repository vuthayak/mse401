<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!--
      GitHub Pages cannot set response headers, so CSP is delivered via meta.
      style-src needs 'unsafe-inline' because this app uses React inline styles.
      connect-src covers Supabase REST/Realtime and the Render recommender API.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.onrender.com http://localhost:* http://127.0.0.1:*;"
    />
    <title>Fitting Room Surveys</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
